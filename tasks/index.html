<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="tasks — the ecosys to-do app" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>tasks</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="../shared/icons/tasks.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint (no flash).
      try {
        var s = JSON.parse(localStorage.getItem('ecosys:v1:settings') || '{}');
        var t = s.theme || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.accent = s.accent || 'iris';
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="./tasks.css" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>tasks needs JavaScript to run.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
