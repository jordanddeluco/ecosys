<!doctype html>
<html lang="en" class="home-page">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="ecosys: Tasks, Schedule, Notes and your AI assistants, one click away" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ecosys" />
    <title>ecosys</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="shared/icons/ecosys.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="shared/icons/ecosys-180.png" />
    <script src="shared/boot.js"></script>
    <link rel="stylesheet" href="shared/ui.css" />
    <link rel="stylesheet" href="home.css" />
    <!-- home.js imports only shared/shell.js. The rest is the shell's own module graph, whose deepest chain
         (shell.js → model.js → notes/core/schema.js → sanitize.js) is fetched in parallel instead of in turn. -->
    <link rel="modulepreload" href="home.js" />
    <link rel="modulepreload" href="shared/shell.js" />
    <link rel="modulepreload" href="shared/store.js" />
    <link rel="modulepreload" href="shared/model.js" />
    <link rel="modulepreload" href="notes/core/schema.js" />
    <link rel="modulepreload" href="shared/sanitize.js" />
    <link rel="modulepreload" href="shared/dates.js" />
    <link rel="modulepreload" href="shared/icons.js" />
  </head>
  <body>
    <div id="home"></div>
    <noscript><p class="home-noscript">ecosys needs JavaScript to run.</p></noscript>
    <!-- shared/store.js imports notes/core/schema.js, so the notes, folders and task.source validators
         are registered before any data is validated. -->
    <script type="module" src="home.js"></script>
  </body>
</html>
